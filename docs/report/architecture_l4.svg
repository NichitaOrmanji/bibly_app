<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3949AB"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B71C1C"/>
    </marker>
  </defs>

  <!-- Слой 1: экраны -->
  <rect x="20" y="15" width="560" height="92" rx="12" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.5"/>
  <text x="35" y="38" font-weight="700" font-size="15">Экраны (UI) — lib/screens/</text>
  <text x="35" y="60">Мой день · Библия · Книга · Глава · Поиск · Дневник · Скиния</text>
  <text x="35" y="79">Запись · Вместе · Группа · Профиль · формы записи и профиля</text>
  <text x="35" y="98" fill="#555" font-size="12">не знают ИСТОЧНИКА данных; три состояния: грузится / ошибка + «Повторить» / данные</text>

  <!-- Стрелки UI ↔ модели -->
  <line x1="150" y1="107" x2="150" y2="168" stroke="#3949AB" stroke-width="2" marker-end="url(#a)"/>
  <text x="158" y="134" fill="#3949AB">watch — в build</text>
  <text x="158" y="150" fill="#3949AB">(показываю и слежу)</text>
  <line x1="330" y1="107" x2="330" y2="168" stroke="#3949AB" stroke-width="2" marker-end="url(#a)"/>
  <text x="338" y="134" fill="#3949AB">read — в callback</text>
  <text x="338" y="150" fill="#3949AB">(действую: load, add…)</text>
  <line x1="500" y1="168" x2="500" y2="107" stroke="#2E7D32" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#g)"/>
  <text x="508" y="134" fill="#2E7D32">notifyListeners()</text>
  <text x="508" y="150" fill="#2E7D32">→ все подписчики</text>

  <!-- Слой 2: модели -->
  <rect x="20" y="170" width="560" height="100" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="35" y="193" font-weight="700" font-size="15">Модели ChangeNotifier — lib/models/*_model.dart</text>
  <text x="35" y="215">DayPlanModel · DiaryModel · BibleModel · CommunityModel · ProfileModel</text>
  <text x="35" y="235" fill="#555" font-size="12">состояние + логика темы; коллекции наружу — List.unmodifiable;</text>
  <text x="35" y="252" fill="#555" font-size="12">хранилище — через конструктор (тип поля — ИНТЕРФЕЙС); мутации → String? (null = успех)</text>

  <!-- Модели → интерфейсы -->
  <line x1="300" y1="270" x2="300" y2="328" stroke="#3949AB" stroke-width="2" marker-end="url(#a)"/>
  <text x="310" y="298" fill="#3949AB" font-weight="700">Future&lt;Result&lt;T&gt;&gt;</text>
  <text x="310" y="315" fill="#555" font-size="12">Ok(value) | Err(msg) — sealed, switch исчерпывающий</text>

  <!-- Слой 3: интерфейсы -->
  <rect x="20" y="330" width="560" height="78" rx="12" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="35" y="353" font-weight="700" font-size="15">Интерфейсы хранилищ — lib/data/*_repository.dart</text>
  <text x="35" y="375">DiaryRepository (CRUD) · BibleRepository · CommunityRepository</text>
  <text x="35" y="395">ProfileRepository · DailyRepository — контракт «ЧТО можно просить»</text>

  <!-- implements -->
  <line x1="200" y1="468" x2="200" y2="410" stroke="#F9A825" stroke-width="2" marker-end="url(#a)"/>
  <text x="210" y="444" fill="#8D6E00">implements</text>
  <line x1="660" y1="468" x2="582" y2="400" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="625" y="425" fill="#757575" font-size="12">implements</text>

  <!-- Слой 4: mock -->
  <rect x="20" y="470" width="460" height="112" rx="12" fill="#FCE4EC" stroke="#B71C1C" stroke-width="1.5"/>
  <text x="35" y="493" font-weight="700" font-size="15">Сегодня (ЛР4) — lib/data/mock/</text>
  <text x="35" y="515">Mock*Repository ×5 — память + seed из mock_data.dart</text>
  <text x="35" y="535">MockNetwork: Future.delayed(800 мс) + simulateError</text>
  <text x="35" y="555" fill="#555" font-size="12">mock_data.dart импортируют ТОЛЬКО эти 5 файлов</text>
  <text x="35" y="572" fill="#555" font-size="12">выбор источника — одно место: createApp() в main.dart</text>

  <!-- ЛР5 -->
  <rect x="500" y="470" width="260" height="112" rx="12" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="515" y="493" font-weight="700" font-size="15" fill="#616161">На ЛР5</text>
  <text x="515" y="515" fill="#616161">Http*Repository → REST API</text>
  <text x="515" y="535" fill="#616161">меняются: новые реализации</text>
  <text x="515" y="555" fill="#616161">+ main.dart (корень композиции)</text>
  <text x="515" y="572" fill="#616161">экраны и модели — НЕ трогаются</text>

  <!-- Переключатель аварии -->
  <rect x="600" y="170" width="160" height="100" rx="12" fill="#FFEBEE" stroke="#B71C1C" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="612" y="193" font-weight="700" fill="#B71C1C">Переключатель</text>
  <text x="612" y="211" font-weight="700" fill="#B71C1C">аварии (Профиль)</text>
  <text x="612" y="229" font-size="12">setState +</text>
  <text x="612" y="245" font-size="12">read&lt;MockNetwork&gt;()</text>
  <text x="612" y="261" font-size="12">— леса, уйдут на ЛР5</text>
  <line x1="680" y1="270" x2="440" y2="470" stroke="#B71C1C" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#r)"/>
  <text x="596" y="300" fill="#B71C1C" font-size="12">simulateError</text>
</svg>
